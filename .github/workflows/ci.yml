name: Safety and package verification
on:
  push:
    branches: [main, feat/advanced-safe-cleanup]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run check:advanced
      - run: pnpm test
      - name: Verify packaged advanced and legacy binaries
        shell: bash
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/package-check"
          tar -xzf "$RUNNER_TEMP/dev-clean-0.2.0.tgz" -C "$RUNNER_TEMP/package-check"
          node "$RUNNER_TEMP/package-check/package/bin/dev-clean.js" advanced-help
          test -f "$RUNNER_TEMP/package-check/package/dist/cli.js"
          node bin/dev-clean.js --version
      - name: Dependency advisory report
        run: pnpm audit --prod --audit-level high
